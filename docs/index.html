<style>
:root {
  --bg: #0f1626;
  --ink: #e6edf7;
  --muted: #a9b6cc;
  --line: #2a3a56;
  --btn: #2f6fed;
  --btn-ink: #fff;
}
* { box-sizing: border-box; }
html { scroll-padding-top: 1rem; }
body {
  margin: 0;
  background: var(--bg);
  color: var(--ink);
  font: 18px/1.55 -apple-system, BlinkMacSystemFont, "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
}
a { color: inherit; }
a:focus-visible, button:focus-visible {
  outline: 2px solid var(--ink);
  outline-offset: 3px;
}
.skip {
  position: absolute;
  left: 1rem;
  top: 0;
  transform: translateY(-120%);
  background: var(--ink);
  color: var(--bg);
  padding: 0.4rem 0.7rem;
}
.skip:focus { transform: none; }
.wrap { width: min(880px, calc(100% - 2rem)); margin: 0 auto; }
header { padding: 1.25rem 0 0; }
.name { margin: 0; font-size: 0.95rem; font-weight: 650; letter-spacing: 0.01em; }
main { padding: 2.5rem 0 3rem; }

.lead { margin: 1rem 0 0; max-width: 36rem; color: var(--muted); }
.actions { display: flex; flex-wrap: wrap; gap: 0.75rem; margin: 1.5rem 0 0; }
.btn {
  display: inline-block;
  background: var(--btn);
  color: var(--btn-ink);
  text-decoration: none;
  padding: 0.75rem 1rem;
  border-radius: 8px;
  font-weight: 650;
}
.btn.quiet {
  background: transparent;
  color: var(--ink);
  box-shadow: inset 0 0 0 1px var(--line);
}
.note { margin: 1rem 0 0; color: var(--muted); font-size: 0.95rem; }
figure { margin: 2rem 0 0; }
img { width: 100%; height: auto; border-radius: 10px; background: #fff; }
figcaption { margin-top: 0.6rem; color: var(--muted); font-size: 0.92rem; }
footer { border-top: 1px solid var(--line); padding: 1.25rem 0 2rem; color: var(--muted); font-size: 0.92rem; }
footer a { color: var(--ink); }
@media (max-width: 640px) {
  .actions { display: grid; }
}
